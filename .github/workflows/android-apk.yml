name: Build experimental LSPosed APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile test source with stubs
        run: bash tools/verify-java.sh
      - name: Build APK (not a KernelSU module)
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK Xposed entry and hash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -p "$APK" assets/xposed_init | grep -Fx 'dev.gyziel.pui.nativehook.NativeInstallerHook'
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PUI-NativeRouter-v6-EXPERIMENTAL-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
